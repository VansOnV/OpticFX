.c b{color:#fff;margin-right:6px}
.c.on{background:var(--ac);color:#000;border-color:var(--ac)}
.c.on b{color:#000}

body.hid #ghost{display:block}
#start{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;background:#050505 repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px)}

#err{color:#ff6a60;font-size:12px;max-width:420px;line-height:1.5}
@media(max-width:520px){#top .b{padding:8px 7px;font-size:10px;letter-spacing:.06em}#brand{display:none}}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#fff;color:#000;font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:8px 14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:8}
